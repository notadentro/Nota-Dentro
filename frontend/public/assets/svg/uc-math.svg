<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <rect width="400" height="150" rx="20" fill="#f8fafc" />
  
  <!-- Semínima 1 -->
  <g transform="translate(40, 25)">
    <!-- Cabeça pintada -->
    <ellipse cx="20" cy="80" rx="15" ry="10" transform="rotate(-20 20 80)" fill="#1e293b"/>
    <!-- Haste -->
    <rect x="33" y="10" width="3" height="70" fill="#1e293b"/>
  </g>
  
  <!-- Plus Sign -->
  <text x="145" y="95" font-family="sans-serif" font-size="48" font-weight="bold" fill="#64748b" text-anchor="middle">+</text>
  
  <!-- Semínima 2 -->
  <g transform="translate(170, 25)">
    <!-- Cabeça pintada -->
    <ellipse cx="20" cy="80" rx="15" ry="10" transform="rotate(-20 20 80)" fill="#1e293b"/>
    <!-- Haste -->
    <rect x="33" y="10" width="3" height="70" fill="#1e293b"/>
  </g>
  
  <!-- Equals Sign -->
  <text x="275" y="95" font-family="sans-serif" font-size="48" font-weight="bold" fill="#64748b" text-anchor="middle">=</text>
  
  <!-- Question Mark -->
  <text x="340" y="95" font-family="sans-serif" font-size="64" font-weight="900" fill="#eab308" text-anchor="middle">?</text>
</svg>
